services:
  sakamichi-push:
    image: ghcr.io/tomisatonao/nogizaka-message-push:latest
    # 如需本地直接构建运行，可取消下一行注释：
    # build: .
    container_name: sakamichi-push
    restart: unless-stopped
    ports:
      # 管理端默认仅暴露给宿主机；要公网访问请经 HTTPS 反向代理转发。
      - "127.0.0.1:46046:46046"
      # NapCat 入站事件端口默认仅绑定宿主机；跨主机 NapCat 时设置
      # NAPCAT_EVENT_BIND 为 NAS 局域网 IP，并由防火墙限制来源。
      - "${NAPCAT_EVENT_BIND:-127.0.0.1}:46047:46047"
    environment:
      - TZ=Asia/Tokyo
      # 可直接在此处注入密钥（或写入挂载的 .env 文件）：
      # - WEB_ADMIN_TOKEN=your_admin_token
      # - GEMINI_API_KEY=AIzaSy...
      # - TG_BOT1_TOKEN=123456:ABC-DEF...  # 对应 config.json 的 tg_bot1
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
