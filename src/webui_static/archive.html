<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📚</text></svg>">
<title>坂道监控 · 消息归档</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
  :root { --bubble: var(--card); --trans-bg: var(--ok-soft); --trans-text: var(--ok); }
  header { display: flex; align-items: center; gap: 12px; padding: 11px 20px;
           background: color-mix(in srgb, var(--card) 82%, transparent);
           backdrop-filter: blur(14px) saturate(1.3);
           -webkit-backdrop-filter: blur(14px) saturate(1.3);
           border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 15.5px; margin: 0; font-weight: 650; color: var(--text-strong); }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; margin-left: 12px; }
  header a:hover { color: var(--accent); }
  .layout { display: flex; gap: 18px; max-width: 1060px; margin: 0 auto; padding: 16px 16px 60px; }
  aside.side { width: 258px; flex: none; position: sticky; top: 64px; align-self: flex-start; }
  main { flex: 1; min-width: 0; margin: 0; padding: 0; }
  .calendar-toggle { display: none; }
  @media (max-width: 900px) {
    .layout { display: block; }
    aside.side { width: auto; position: static; margin-bottom: 12px; }
    .calendar-toggle { display: block; width: 100%; }
    aside.side:not(.expanded) .cal { display: none; }
  }
  /* 日历 */
  .cal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .title { font-weight: 600; font-size: 14px; }
  .cal-head button { border: 1px solid var(--border); background: var(--bg); color: var(--text);
                     border-radius: 6px; cursor: pointer; padding: 3px 9px; font-size: 13px; }
  .cal-head button:hover { border-color: var(--accent); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--muted); padding: 3px 0; }
  .cal-day { position: relative; aspect-ratio: 1; border: 0; width: 100%; border-radius: 7px; display: flex;
              flex-direction: column; align-items: center; justify-content: center;
              font-size: 11.5px; color: var(--muted); background: transparent; font-family: inherit; }
  .cal-day.has { cursor: pointer; color: var(--text); }
  .cal-day.has:hover { outline: 2px solid var(--accent); }
  .cal-day:focus-visible, .tag-chip:focus-visible, .tag-edit:focus-visible,
  #lightbox button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-day .n { font-size: 9.5px; color: var(--accent); font-weight: 600; line-height: 1; }
  .cal-day.h1 { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .cal-day.h2 { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .cal-day.h3 { background: color-mix(in srgb, var(--accent) 38%, transparent); }
  .cal-day.today { outline: 1px dashed var(--muted); }
  .cal-foot { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }
  .day-sep { scroll-margin-top: 120px; }
  .day-sep.flash span { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 13px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
          background: var(--card); color: var(--text); font-size: 13px; font-family: inherit;
          transition: border-color var(--tr), background var(--tr), color var(--tr); }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent);
                 font-weight: 650; box-shadow: 0 1px 6px var(--accent-ring); }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  #searchBox {
    flex: 1; min-width: 220px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 16px;
  }
  #searchBox:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
           background: var(--card); color: var(--text); font-size: 13.5px; font-family: inherit; }
  button.nav { border: 1px solid var(--border); background: var(--card); color: var(--text);
               padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  button.nav:hover { border-color: var(--accent); }
  button.nav:disabled { opacity: .4; cursor: default; }
  .stats { font-size: 12.5px; color: var(--muted); margin-left: auto; }
  .day-sep { text-align: center; margin: 18px 0 10px; color: var(--muted); font-size: 12px; }
  .day-sep span { background: var(--card); border: 1px solid var(--border);
                  border-radius: 999px; padding: 3px 14px; }
  .bubble { background: var(--bubble); border: 1px solid var(--border);
            border-radius: 16px 16px 16px 5px; padding: 12px 15px; margin: 9px 0; max-width: 92%;
            box-shadow: var(--shadow-sm); overflow-wrap: break-word;
            transition: box-shadow var(--tr); }
  .bubble:hover { box-shadow: var(--shadow-md); }
  .bubble .time { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .bubble .text { white-space: pre-wrap; line-height: 1.7; }
  .bubble .trans { margin-top: 8px; padding: 8px 11px; background: var(--trans-bg);
                   color: var(--trans-text); border-radius: 9px; font-size: 13.5px;
                   white-space: pre-wrap; line-height: 1.65; }
  /* height:auto + width/height 属性 = 加载前按纵横比预留占位，消除布局位移 */
  .bubble img { max-width: 100%; height: auto; max-height: 600px; object-fit: contain;
                object-position: left; border-radius: 10px; cursor: zoom-in; display: block; }
  .bubble video { max-width: 100%; height: auto; max-height: 560px;
                  border-radius: 10px; display: block; }
  .bubble audio { max-width: 100%; display: block; }
  .bubble .miss { color: var(--err); font-size: 12.5px; }
  .center { text-align: center; padding: 28px 0; color: var(--muted); }
  #loadMore { display: block; margin: 18px auto; }
  #loadMore[hidden] { display: none; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-chip { display: inline-block; padding: 2px 10px; border-radius: 999px;
               background: var(--accent-soft); color: var(--accent); font-size: 12px;
               cursor: pointer; border: 1px solid transparent; transition: all var(--tr); font-family: inherit; }
  .tag-chip:hover { border-color: var(--accent); box-shadow: 0 1px 6px var(--accent-ring); }
  .tag-chip.custom { background: color-mix(in srgb, var(--warn) 12%, transparent);
                     color: var(--warn); border-style: dashed; }
  .tag-chip.custom:hover { border-color: var(--warn); box-shadow: 0 1px 6px
    color-mix(in srgb, var(--warn) 30%, transparent); }
  .tag-edit { display: inline-block; padding: 2px 9px; border-radius: 999px;
               border: 1px dashed var(--border); background: transparent;
               color: var(--muted); font-size: 12px; cursor: pointer; transition: all var(--tr); font-family: inherit; }
  .tag-edit:hover { border-color: var(--accent); color: var(--accent); }
  .tag-input { font-size: 12px; padding: 2px 8px; border: 1px solid var(--accent);
               border-radius: 999px; background: var(--bg); color: var(--text);
               width: 120px; outline: none; }
  .toggle-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .toggle-row input[type=checkbox] { accent-color: var(--accent); }
  body.hide-tags .tags { display: none !important; }
  /* 灯箱 */
  #backTop { position: fixed; bottom: 32px; right: 28px; z-index: 50; display: none;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--card) 85%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--text); font-size: 18px; cursor: pointer; line-height: 38px;
    text-align: center; box-shadow: var(--shadow-sm); transition: opacity var(--tr), visibility var(--tr); }
  #backTop:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  #backTop.show { display: block; }
  /* 灯箱 */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none;
              align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 6px; }
  #lightbox .nav-btn { position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.12); color: #fff; border: none; font-size: 26px;
    padding: 14px 16px; cursor: pointer; border-radius: 10px; }
  #lightbox .nav-btn:hover { background: rgba(255,255,255,.25); }
  #lbPrev { left: 14px; } #lbNext { right: 14px; }
  #lbClose { position: absolute; right: 14px; top: 12px; background: transparent; color: #fff;
             border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #lbCounter { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
               color: #ddd; font-size: 13px; z-index: 101; pointer-events: none; }

  /* 一键复制与 Toast 浮窗 */
  .copy-btn {
    float: right;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-ring);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .copy-btn:hover {
    background: var(--accent);
    color: #ffffff;
  }
  .toast-msg {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--text-strong);
    color: var(--card);
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    z-index: 99999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s cubic-bezier(.3, .8, .4, 1), transform 0.25s cubic-bezier(.3, .8, .4, 1);
  }
  .toast-msg.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 手机端适配（≤640px） ──────────────────────── */
  @media (max-width: 640px) {
    /* header：标题 + 成员 chips 横滑一行 */
    header { padding: 8px 12px; gap: 8px; }
    header h1 { font-size: 14px; }
    header a { margin-left: 8px; font-size: 12px; }
    #memberChips {
      flex-wrap: nowrap; overflow-x: auto; order: 20; flex-basis: 100%;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #memberChips::-webkit-scrollbar { display: none; }
    #memberChips .chip { flex: none; min-height: 38px; padding: 6px 12px; font-size: 12.5px; }

    /* 布局留白收窄 */
    .layout { padding: 12px 12px 64px; }

    /* 日历：单元格 44px 触控高度 */
    .cal { padding: 10px; }
    .cal-grid { gap: 2px; }
    .cal-day { aspect-ratio: auto; height: 44px; font-size: 14px; }
    .cal-day .n { font-size: 11px; }
    .cal-dow { font-size: 11.5px; }
    .cal-head button { padding: 6px 10px; min-height: 40px; font-size: 13px; }

    /* 搜索栏满宽独占一行 */
    #searchBox { flex-basis: 100%; min-width: 0; }
    .stats { flex-basis: 100%; margin-left: 0; font-size: 12px; }
    .toolbar { gap: 8px; }
    .chip { padding: 8px 12px; font-size: 13px; }
    select, button.nav { padding: 8px 12px; font-size: 14px; }

    /* 消息气泡 */
    .bubble { max-width: 100%; padding: 10px 12px; }
    .bubble img { max-height: min(50vh, 480px); }
    .tag-chip { padding: 3px 12px; font-size: 13px; }
    .copy-btn { padding: 7px 12px; font-size: 12.5px; }

    /* 回到顶部：44px + 底部安全区 */
    #backTop {
      width: 44px; height: 44px; line-height: 42px; font-size: 18px;
      bottom: max(14px, env(safe-area-inset-bottom));
      right: max(14px, env(safe-area-inset-right));
    }

    /* 日历折叠按钮 */
    .calendar-toggle { font-size: 14px; padding: 10px; }

    /* 灯箱：导航移到底部两角，避开刘海 */
    #lightbox .nav-btn {
      top: auto; bottom: max(16px, env(safe-area-inset-bottom));
      transform: none; padding: 12px 16px; font-size: 24px;
      min-width: 48px; min-height: 48px;
    }
    #lbPrev  { left: max(10px, env(safe-area-inset-left)); }
    #lbNext  { right: max(10px, env(safe-area-inset-right)); }
    #lbClose {
      right: max(10px, env(safe-area-inset-right));
      top: max(10px, env(safe-area-inset-top));
      padding: 8px 12px; min-height: 40px;
    }
    #lbCounter { top: max(12px, env(safe-area-inset-top)); font-size: 12px; }
  }

  /* ── 首页 ── */
  .home { display: none; max-width: 800px; margin: 0 auto; padding: 20px 20px 60px; }
  .home.active { display: block; }
  .home-label { font-size: 13.5px; font-weight: 650; color: var(--muted);
                margin: 24px 0 10px; letter-spacing: .04em; }
  .home-label:first-of-type { margin-top: 0; }

  /* 成员信息行 */
  .home-member { text-align: center; margin-bottom: 8px; }
  .home-member .hm-name { font-size: 20px; font-weight: 700; color: var(--text-strong); }
  .home-member .hm-stats { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* 横向滚动图片卡片条 */
  .photo-strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
                 -webkit-overflow-scrolling: touch; scrollbar-width: none;
                 padding: 4px 0 14px; }
  .photo-strip::-webkit-scrollbar { display: none; }
  .photo-card { flex: none; width: 180px; scroll-snap-align: start;
                border-radius: 14px; overflow: hidden; background: var(--card);
                border: 1px solid var(--border); cursor: pointer;
                transition: transform .16s, box-shadow .16s; }
  .photo-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .photo-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .photo-card .pc-cap { padding: 8px 10px; font-size: 12px; color: var(--text);
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 消息列表 */
  .msg-list { display: flex; flex-direction: column; gap: 8px; }
  .msg-preview { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
                 padding: 12px 15px; cursor: pointer; transition: box-shadow var(--tr), border-color var(--tr); }
  .msg-preview:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
  .msg-preview .mp-time { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .msg-preview .mp-text { font-size: 13.5px; color: var(--text); line-height: 1.55;
                           white-space: pre-wrap; overflow: hidden; display: -webkit-box;
                           -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .msg-preview .mp-trans { font-size: 12.5px; color: var(--ok); margin-top: 4px; line-height: 1.5;
                            overflow: hidden; display: -webkit-box;
                            -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* 快捷入口 */
  .home-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; justify-content: center; }
  .home-actions .ha-btn {
    padding: 9px 20px; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 13.5px; font-family: inherit; font-weight: 600;
    transition: all var(--tr);
  }
  .home-actions .ha-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .home-actions .ha-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; box-shadow: 0 5px 16px var(--accent-ring);
  }

  /* 多成员卡片 */
  .member-cards { display: flex; flex-direction: column; gap: 14px; }
  .member-card { display: flex; gap: 14px; padding: 14px; border-radius: var(--radius);
                 background: var(--card); border: 1px solid var(--border);
                 cursor: pointer; transition: box-shadow var(--tr), border-color var(--tr); }
  .member-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
  .member-card .mcover { width: 80px; height: 80px; border-radius: 12px; object-fit: cover;
                         flex: none; background: var(--bg); }
  .member-card .mmeta { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .member-card .mmeta .mname { font-size: 17px; font-weight: 650; color: var(--text-strong); }
  .member-card .mmeta .mstats { font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    .home { padding: 12px 10px 48px; }
    .photo-card { width: 150px; }
    .home-actions .ha-btn { padding: 10px 16px; font-size: 13px; }
  }
</style>

</head>
<body>
<header>
  <h1>📚 消息归档</h1>
  <div class="chips" id="memberChips"></div>
  <span id="whoami" style="font-size:12.5px; color:var(--muted)"></span>
  <a href="#" id="homeNavLink" onclick="goHome();return false" style="margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px" title="回到首页">🏠 首页</a>
  <button class="theme-toggle" type="button" title="切换主题">🖥️</button>
  <a href="/" id="adminLink" hidden>⚙️ 管理端</a>
  <a href="#" id="logoutLink" hidden style="margin-left:0">登出</a>
</header>

<div id="archiveHome" class="home">
  <div class="home-hero">
    <div class="home-member" id="homeMember"></div>
    <h2 class="home-label">最新写真</h2>
    <div class="photo-strip" id="photoStrip"></div>
    <h2 class="home-label">最近消息</h2>
    <div class="msg-list" id="homeMsgList"></div>
    <div class="home-actions" id="homeActions"></div>
  </div>
</div>

<div class="layout">
<aside class="side" id="archiveSide">
  <button class="nav calendar-toggle" id="calendarToggle" type="button" aria-expanded="false">▦ 按日期跳转</button>
  <div class="cal">
    <div class="cal-head">
      <button id="calPrev">◀</button>
      <span class="title" id="calTitle">—</span>
      <button id="calNext">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot" id="calFoot"></div>
  </div>
</aside>
<main>
  <div class="toolbar">
    <button class="nav" id="prevMonth">← 上月</button>
    <select id="monthSelect"></select>
    <button class="nav" id="nextMonth">下月 →</button>
    <div class="chips" id="typeChips"></div>
    <span class="stats" id="stats"></span>
  </div>
  <div class="toolbar">
    <input type="search" id="searchBox" maxlength="100" placeholder="🔍 搜索原文 / 译文（空格分词）">
    <button class="nav" id="searchSubmit" type="button">搜索</button>
    <button class="nav" id="searchClear" hidden>✕ 清除搜索</button>
    <label class="toggle-row"><input type="checkbox" id="tagToggle" checked> 显示标签</label>
  </div>
  <div id="timeline"></div>
  <button class="nav" id="loadMore" hidden>加载更多 ↓</button>
  <div class="center" id="emptyHint" hidden></div>
</main>
</div>

<button id="backTop" title="回到顶部">⬆</button>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" aria-hidden="true">
  <span id="lbCounter"></span>
  <button id="lbClose" type="button" aria-label="关闭图片预览">关闭</button>
  <button class="nav-btn" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="nav-btn" id="lbNext">›</button>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const authToken = localStorage.getItem("webAdminToken") || "";
const TYPES = [["", "全部"], ["text", "文字"], ["picture", "图片"], ["video", "视频"], ["voice", "语音"]];

let members = [];        // [{name, display, total, months}]
let curMember = "";
let months = [];         // [{year, month, count}] 新的在前
let curYM = null;        // {year, month}
let curType = "";
let page = 1, totalPages = 1;
let images = [];         // 当月已渲染图片 [{url, caption}]，供灯箱翻页
let lastDay = "";
let searchQuery = "";    // 非空 = 搜索模式
let dayCounts = {};      // "YYYY-MM-DD" -> 条数（日历用）
let calYM = null;        // 日历当前显示的 {year, month}（可独立于时间线翻页）
let contentVersion = 0;  // 成员 / 月份 / 筛选变化后，旧响应不应覆盖新页面
let contentAbort = null;
let pageLoading = false;
let calendarVersion = 0;
let calendarAbort = null;
let lightboxOpener = null;
let memberVersion = 0;

function esc(s) { const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }
function mediaUrl(u) { return u + (authToken ? "?token=" + encodeURIComponent(authToken) : ""); }

async function api(path, options = {}) {
  const resp = await fetch(path, {
    headers: authToken ? { "X-Auth-Token": authToken } : {},
    cache: "no-store",
    signal: options.signal,
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error((data.errors || ["HTTP " + resp.status]).join("；"));
  return data;
}

function normalizedQuery(value) { return String(value || "").trim().slice(0, 100); }
function syncSearchInput() { $("searchBox").value = searchQuery; $("searchClear").hidden = !searchQuery; }
function resetContent() {
  contentVersion++;
  if (contentAbort) contentAbort.abort();
  contentAbort = null;
  pageLoading = false;
  page = 1; totalPages = 1; images = []; lastDay = "";
  $("timeline").innerHTML = "";
  $("emptyHint").hidden = true;
  $("loadMore").hidden = true;
  $("loadMore").disabled = false;
  $("loadMore").textContent = "加载更多 ↓";
  return contentVersion;
}
function highlightQuery(str, query) {
  if (!str) return "";
  if (!query) return esc(str);
  const terms = query.split(/\s+/).filter(Boolean);
  if (!terms.length) return esc(str);
  let safe = esc(str);
  terms.forEach(t => {
    try {
      const re = new RegExp("(" + escRegex(t) + ")", "gi");
      safe = safe.replace(re, '<mark class="search-highlight">$1</mark>');
    } catch(e){}
  });
  return safe;
}

function escRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function initInfiniteScroll() {
  window.addEventListener("scroll", () => {
    if (pageLoading || page >= totalPages) return;
    const scrollBottom = window.innerHeight + window.scrollY;
    const docHeight = document.documentElement.scrollHeight;
    if (docHeight - scrollBottom < 350) {
      page++;
      loadPage();
    }
  }, { passive: true });
}


function setPageLoading(loading) {
  pageLoading = loading;
  $("loadMore").disabled = loading;
  $("loadMore").textContent = loading ? "加载中…" : "加载更多 ↓";
}


// ── JST 时间 ─────────────────────────────────────
function toJst(utc) { return new Date(new Date(utc).getTime() + 9 * 3600 * 1000); }
function fmtDay(utc) {
  const d = toJst(utc);
  const w = "日一二三四五六"[d.getUTCDay()];
  return d.getUTCFullYear() + "/" + (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "（" + w + "）";
}
function fmtTime(utc) {
  const d = toJst(utc);
  return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0");
}
function fmtCopyTime(utc) {
  const d = toJst(utc);
  const m = String(d.getUTCMonth() + 1).padStart(2, "0");
  const day = String(d.getUTCDate()).padStart(2, "0");
  const hh = String(d.getUTCHours()).padStart(2, "0");
  const mm = String(d.getUTCMinutes()).padStart(2, "0");
  const ss = String(d.getUTCSeconds()).padStart(2, "0");
  return m + "/" + day + " " + hh + ":" + mm + ":" + ss;
}

function fmtDateKey(utc) {
  const d = toJst(utc);
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") +
         "-" + String(d.getUTCDate()).padStart(2, "0");
}

// ── 日历 ─────────────────────────────────────────
async function loadCalendar() {
  const version = ++calendarVersion;
  if (calendarAbort) calendarAbort.abort();
  calendarAbort = new AbortController();
  try {
    const data = await api("/api/archive/calendar?member=" + encodeURIComponent(curMember) +
                           "&type=" + curType, { signal: calendarAbort.signal });
    if (version !== calendarVersion) return;
    dayCounts = data.ok ? data.days : {};
  } catch (e) {
    if (e.name === "AbortError" || version !== calendarVersion) return;
    dayCounts = {};
  }
  if (version !== calendarVersion) return;
  renderCalendar();
}

function renderCalendar() {
  if (!calYM) return;
  const { year, month } = calYM;
  $("calTitle").textContent = year + " 年 " + month + " 月";
  const grid = $("calGrid");
  grid.innerHTML = "";
  for (const w of ["日", "一", "二", "三", "四", "五", "六"]) {
    const h = document.createElement("div");
    h.className = "cal-dow";
    h.textContent = w;
    grid.appendChild(h);
  }
  const firstDow = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
  for (let i = 0; i < firstDow; i++) grid.appendChild(document.createElement("div"));
  let monthTotal = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = year + "-" + String(month).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const n = dayCounts[key] || 0;
    monthTotal += n;
    const cell = document.createElement(n > 0 ? "button" : "div");
    cell.className = "cal-day" + (n > 0 ? " has" : "") +
      (n >= 6 ? " h3" : n >= 3 ? " h2" : n >= 1 ? " h1" : "");
    cell.textContent = d;
    if (n > 0) {
      cell.type = "button";
      cell.title = key + " · " + n + " 条";
      cell.setAttribute("aria-label", key + "，共 " + n + " 条消息，跳转到当天");
      const count = document.createElement("span");
      count.className = "n";
      count.textContent = n;
      cell.appendChild(count);
      cell.addEventListener("click", () => jumpToDay(key));
    }
    grid.appendChild(cell);
  }
  $("calFoot").textContent = monthTotal > 0 ? "本月 " + monthTotal + " 条 · 点日期跳转" : "本月无消息";
}

$("calPrev").addEventListener("click", () => {
  calYM = calYM.month === 1 ? { year: calYM.year - 1, month: 12 }
                            : { year: calYM.year, month: calYM.month - 1 };
  renderCalendar();
});
$("calNext").addEventListener("click", () => {
  calYM = calYM.month === 12 ? { year: calYM.year + 1, month: 1 }
                             : { year: calYM.year, month: calYM.month + 1 };
  renderCalendar();
});

async function jumpToDay(dateKey) {
  const [y, m] = dateKey.split("-").map(Number);
  searchQuery = "";
  syncSearchInput();
  await selectMonth(y, m);
  let jumpVersion = contentVersion;
  // 加载全月（最多几页），保证目标日期的分隔条已渲染
  while (jumpVersion === contentVersion && page < totalPages) { page++; await loadPage(); }
  if (jumpVersion !== contentVersion) return;
  $("loadMore").hidden = true;
  // 兜底：当前类型筛选下该日期没有消息 → 自动切回「全部」重载
  if (!document.querySelector('.day-sep[data-date="' + dateKey + '"]') && curType) {
    curType = "";
    $("typeChips").querySelectorAll(".chip").forEach((c, i) =>
      c.classList.toggle("active", TYPES[i][0] === ""));
    loadCalendar();
    await selectMonth(y, m);
    jumpVersion = contentVersion;
    while (jumpVersion === contentVersion && page < totalPages) { page++; await loadPage(); }
    if (jumpVersion !== contentVersion) return;
    $("loadMore").hidden = true;
  }

  // ── 滚动定位 + 校正 ──
  // 全月消息加载完成后，图片是 lazy 的，加载时会撑高 DOM 把目标位置
  // 往下推，所以需要定时校正几次。但一旦用户主动操作（滚轮 / 触摸 /
  // 键盘），说明不需要这个位置了，立即停掉所有后续校正。
  let cancelled = false;
  const cancel = () => { cancelled = true; };
  window.addEventListener("wheel", cancel, { once: true, passive: true });
  window.addEventListener("touchstart", cancel, { once: true, passive: true });
  window.addEventListener("keydown", cancel, { once: true, passive: true });

  const pin = () => {
    if (cancelled) return false;
    const sep = document.querySelector('.day-sep[data-date="' + dateKey + '"]');
    if (!sep) return false;
    sep.scrollIntoView({ block: "start", behavior: "instant" });
    return true;
  };

  pin();
  setTimeout(pin, 350);
  setTimeout(pin, 900);
  setTimeout(() => {
    if (pin()) {
      const sep = document.querySelector('.day-sep[data-date="' + dateKey + '"]');
      if (sep) {
        sep.classList.add("flash");
        setTimeout(() => sep.classList.remove("flash"), 2500);
      }
    }
  }, 2200);

  // 清理监听器（最多保留 5 秒）
  setTimeout(() => {
    window.removeEventListener("wheel", cancel);
    window.removeEventListener("touchstart", cancel);
    window.removeEventListener("keydown", cancel);
  }, 5000);
}

// ── 数据加载 ─────────────────────────────────────
async function loadMembers() {
  const data = await api("/api/archive/members");
  if (!data.ok) { showEmpty("加载失败：" + (data.errors || []).join("；")); return; }
  members = data.members;
  const box = $("memberChips");
  box.innerHTML = "";
  if (!members.length) {
    showEmpty("还没有任何归档。确认 config.json 的 archive.enabled 已开启，" +
              "新消息会自动归档；历史消息用 python tools/backfill_archive.py 回填。");
    return;
  }
  for (const m of members) {
    const b = document.createElement("button");
    b.className = "chip" + (m.name === curMember ? " active" : "");
    b.textContent = m.display + "（" + m.total + "）";
    b.addEventListener("click", () => { selectMember(m.name); });
    box.appendChild(b);
  }
  // 无论 hash 是否指定成员都要真正加载一次：
  // 早先只在"成员缺失或无效"时才调用，导致带 member= 的深链打开后一片空白
  const wanted = curMember && members.some((m) => m.name === curMember) ? curMember : members[0].name;
  await selectMember(wanted, true);
}

async function selectMember(name, keepHash) {
  const version = ++memberVersion;
  curMember = name;
  if (!keepHash) searchQuery = "";
  syncSearchInput();
  $("memberChips").querySelectorAll(".chip").forEach((c, i) =>
    c.classList.toggle("active", members[i] && members[i].name === name));
  const data = await api("/api/archive/months?member=" + encodeURIComponent(name));
  if (version !== memberVersion) return;
  months = data.ok ? data.months : [];
  const sel = $("monthSelect");
  sel.innerHTML = "";
  for (const m of months) {
    const opt = document.createElement("option");
    opt.value = m.year + "-" + m.month;
    opt.textContent = m.year + " 年 " + m.month + " 月（" + m.count + "）";
    sel.appendChild(opt);
  }
  if (!months.length) { showEmpty("该成员还没有归档内容"); return; }
  loadCalendar();   // 后台拉全档按天计数，不阻塞时间线
  const wanted = keepHash ? readHashYM() : null;
  const pick = (wanted && months.find((m) => m.year === wanted.year && m.month === wanted.month)) || months[0];
  await selectMonth(pick.year, pick.month);
  if (searchQuery) startSearch(searchQuery, false);
}

function readHashYM() {
  const p = new URLSearchParams(location.hash.slice(1));
  const y = parseInt(p.get("y"), 10), m = parseInt(p.get("m"), 10);
  return (y && m) ? { year: y, month: m } : null;
}

let selfHashUpdate = false;   // 区分"自己写的 hash"和"用户粘贴/前进后退"

function syncHash() {
  if (!curYM) return;
  selfHashUpdate = true;
  const p = new URLSearchParams({ member: curMember, y: curYM.year, m: curYM.month });
  if (curType) p.set("t", curType);
  if (searchQuery) p.set("q", searchQuery);
  location.hash = p.toString();
  setTimeout(() => { selfHashUpdate = false; }, 0);
}

// 同一标签页里粘贴另一个深链（或前进/后退）时，hash 变了但 SPA 不会重载，
// 需要手动把新状态应用上
window.addEventListener("hashchange", async () => {
  if (selfHashUpdate) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const m = p.get("member") || "";
  const y = parseInt(p.get("y"), 10), mo = parseInt(p.get("m"), 10);
  const t = p.get("t") || "";
  const q = normalizedQuery(p.get("q"));
  if (t !== curType) {
    curType = t;
    $("typeChips").querySelectorAll(".chip").forEach((c, i) =>
      c.classList.toggle("active", TYPES[i][0] === curType));
    loadCalendar();
  }
  if (m && m !== curMember && members.some((x) => x.name === m)) {
    searchQuery = q;
    syncSearchInput();
    await selectMember(m, true);
  } else if (q !== searchQuery) {
    searchQuery = q;
    syncSearchInput();
    if (searchQuery) startSearch(searchQuery, false);
    else if (curYM) selectMonth(curYM.year, curYM.month);
  } else if (y && mo && curYM && (y !== curYM.year || mo !== curYM.month)) {
    await selectMonth(y, mo);
  } else if (t !== undefined && curYM) {
    await selectMonth(curYM.year, curYM.month);
  }
});

async function selectMonth(year, month) {
  curYM = { year, month };
  calYM = { year, month };
  renderCalendar();
  $("monthSelect").value = year + "-" + month;
  const idx = months.findIndex((m) => m.year === year && m.month === month);
  $("prevMonth").disabled = idx >= months.length - 1;   // months 新的在前
  $("nextMonth").disabled = idx <= 0;
  resetContent();
  syncHash();
  await loadPage();
}

async function loadPage() {
  if (pageLoading || !curMember || !curYM) return;
  const version = contentVersion;
  contentAbort = new AbortController();
  setPageLoading(true);
  const url = searchQuery
    ? "/api/archive/search?member=" + encodeURIComponent(curMember) +
      "&q=" + encodeURIComponent(searchQuery) +
      "&type=" + curType + "&page=" + page + "&per_page=50"
    : "/api/archive/messages?member=" + encodeURIComponent(curMember) +
      "&year=" + curYM.year + "&month=" + curYM.month +
      "&type=" + curType + "&page=" + page + "&per_page=50";
  let data;
  try {
    data = await api(url, { signal: contentAbort.signal });
  } catch (e) {
    if (e.name !== "AbortError" && version === contentVersion) showEmpty("加载失败：" + e.message);
    return;
  } finally {
    if (version === contentVersion) setPageLoading(false);
  }
  if (version !== contentVersion) return;
  if (!data.ok) { showEmpty("加载失败：" + (data.errors || []).join("；")); return; }
  totalPages = data.total_pages;
  if (searchQuery) {
    $("stats").textContent = "搜索「" + searchQuery + "」· " + data.total + " 条" +
      (data.capped ? "（已达上限，仅显示最新 500 条）" : "");
    if (!data.messages.length && page === 1) showEmpty("没有匹配「" + searchQuery + "」的消息");
  } else {
    $("stats").textContent = curYM.year + "/" + curYM.month + " · " + data.total + " 条";
    if (!data.messages.length && page === 1) {
      showEmpty("本月没有" + (curType ? "该类型的" : "") + "消息");
    }
  }
  for (const msg of data.messages) renderBubble(msg);
  $("loadMore").hidden = page >= totalPages;
}

function startSearch(q, updateHash = true) {
  searchQuery = normalizedQuery(q);
  syncSearchInput();
  resetContent();
  if (updateHash) syncHash();
  if (!searchQuery) { if (curYM) selectMonth(curYM.year, curYM.month); return; }
  loadPage();
}
$("searchBox").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && $("searchBox").value.trim()) startSearch($("searchBox").value.trim());
  if (e.key === "Escape") { $("searchBox").value = ""; if (searchQuery) clearSearch(); }
});
$("searchSubmit").addEventListener("click", () => {
  const q = normalizedQuery($("searchBox").value);
  if (q) startSearch(q);
  else $("searchBox").focus();
});
function clearSearch() {
  searchQuery = "";
  syncSearchInput();
  if (curYM) selectMonth(curYM.year, curYM.month);
}
$("searchClear").addEventListener("click", clearSearch);

// ── 标签开关 ─────────────────────────────────────
let showTags = localStorage.getItem("archiveShowTags") !== "false";
$("tagToggle").checked = showTags;
if (!showTags) document.body.classList.add("hide-tags");
$("tagToggle").addEventListener("change", () => {
  showTags = $("tagToggle").checked;
  localStorage.setItem("archiveShowTags", showTags ? "true" : "false");
  document.body.classList.toggle("hide-tags", !showTags);
});

function showEmpty(text) {
  $("emptyHint").textContent = text;
  $("emptyHint").hidden = false;
  $("loadMore").hidden = true;
  $("stats").textContent = "";
}

// ── 渲染 ─────────────────────────────────────────
function renderBubble(msg) {
  const tl = $("timeline");
  const day = fmtDay(msg.published_at);
  if (day !== lastDay) {
    lastDay = day;
    const sep = document.createElement("div");
    sep.className = "day-sep";
    sep.dataset.date = fmtDateKey(msg.published_at);   // 日历跳转定位锚点
    sep.innerHTML = "<span>" + esc(day) + "</span>";
    tl.appendChild(sep);
  }
  const b = document.createElement("div");
  b.className = "bubble virtual-card";
  let html = '<div class="time">' + fmtTime(msg.published_at) + " · " + esc(msg.type);
  if (searchQuery && msg.year) {
    const dateKey = fmtDateKey(msg.published_at);
    html += ' · <a href="#" class="jump" data-date="' + dateKey +
            '" style="color:var(--accent); text-decoration:none">查看当日 →</a>';
  }
  const hasText = Boolean((msg.text && msg.text.trim()) || (msg.translation && msg.translation.trim()));
  if (hasText) {
    html += '<button type="button" class="copy-btn" title="复制整条消息与译文">📋 复制</button>';
  }
  html += "</div>";



  if (msg.media_url) {
    const url = mediaUrl(msg.media_url);
    const dim = (msg.w && msg.h) ? ' width="' + msg.w + '" height="' + msg.h + '"' : "";
    if (msg.type === "video") {
      html += '<video controls preload="metadata" src="' + esc(url) + '"></video>';
    } else if (msg.type === "voice") {
      html += '<audio controls preload="metadata" src="' + esc(url) + '"></audio>';
    } else {
      images.push({ url: url, caption: (msg.text || "").slice(0, 80) });
      html += '<img loading="lazy"' + dim + ' data-lb="' + (images.length - 1) + '" src="' + esc(url) + '" alt="">';
    }
  } else if (msg.download_failed) {
    html += '<div class="miss">⚠️ 媒体文件下载失败（可用回填工具重试）</div>';
  }
  if (msg.text) html += '<div class="text">' + highlightQuery(msg.text, searchQuery) + "</div>";
  if (msg.translation) html += '<div class="trans">' + highlightQuery(msg.translation, searchQuery) + "</div>";
  b.innerHTML = html;

  // ── 标签 ──
  const allTags = [];
  if (msg.tags) for (const t of msg.tags.split(" ").filter(Boolean)) allTags.push({ text: t, type: "auto" });
  if (msg.custom_tags) for (const t of msg.custom_tags.split(" ").filter(Boolean)) allTags.push({ text: t, type: "custom" });

  if (allTags.length > 0 || !searchQuery) {
    const tagsDiv = document.createElement("div");
    tagsDiv.className = "tags";
    for (const { text, type } of allTags) {
      const chip = document.createElement(type === "auto" ? "button" : "span");
      chip.className = "tag-chip" + (type === "custom" ? " custom" : "");
      chip.textContent = (type === "auto" ? "🔍 " : "🏷 ") + text;
      chip.title = type === "auto" ? "搜索「" + text + "」" : "自定义标签「" + text + "」";
      if (type === "auto") {
        chip.type = "button";
        chip.setAttribute("aria-label", "搜索标签「" + text + "」");
        chip.addEventListener("click", () => { $("searchBox").value = text; startSearch(text); });
      }
      tagsDiv.appendChild(chip);
    }

    // 编辑自定义标签（仅管理员可见）
    if (window._isArchiveAdmin) {
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "tag-edit";
    editBtn.textContent = msg.custom_tags ? "✎ 编辑" : "+ 加标签";
    editBtn.title = "添加或编辑自定义标签";
    const input = document.createElement("input");
    input.className = "tag-input";
    input.value = msg.custom_tags || "";
    input.placeholder = "自定义标签，空格分隔";
    input.hidden = true;

    const msgId = msg.id;
    const msgYear = msg.year || curYM.year;
    const msgMonth = msg.month || curYM.month;

    editBtn.addEventListener("click", () => {
      if (input.hidden) {
        input.hidden = false; editBtn.hidden = true; input.focus();
      }
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveTags();
      if (e.key === "Escape") { input.hidden = true; editBtn.hidden = false; input.value = msg.custom_tags || ""; }
    });
    input.addEventListener("blur", () => {
      setTimeout(() => { if (!input.matches(":focus")) { input.hidden = true; editBtn.hidden = false; } }, 150);
    });

    async function saveTags() {
      const val = input.value.trim();
      try {
        const resp = await fetch("/api/archive/tags?member=" + encodeURIComponent(curMember), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: msgId, year: msgYear, month: msgMonth, custom_tags: val }),
        });
        const data = await resp.json();
        if (data.ok) {
          msg.custom_tags = val;
          // 重建标签区
          while (tagsDiv.firstChild) tagsDiv.removeChild(tagsDiv.firstChild);
          const tags = [];
          if (msg.tags) for (const t of msg.tags.split(" ").filter(Boolean)) tags.push({ text: t, type: "auto" });
          if (msg.custom_tags) for (const t of msg.custom_tags.split(" ").filter(Boolean)) tags.push({ text: t, type: "custom" });
          for (const { text, type } of tags) {
            const chip = document.createElement(type === "auto" ? "button" : "span");
            chip.className = "tag-chip" + (type === "custom" ? " custom" : "");
            chip.textContent = (type === "auto" ? "🔍 " : "🏷 ") + text;
            chip.title = type === "auto" ? "搜索「" + text + "」" : "自定义标签「" + text + "」";
            if (type === "auto") {
              chip.type = "button";
              chip.setAttribute("aria-label", "搜索标签「" + text + "」");
              chip.addEventListener("click", () => { $("searchBox").value = text; startSearch(text); });
            }
            tagsDiv.appendChild(chip);
          }
          tagsDiv.appendChild(editBtn);
          tagsDiv.appendChild(input);
          editBtn.textContent = val ? "✎ 编辑" : "+ 加标签";
          editBtn.hidden = false; input.hidden = true;
        } else {
          alert("保存失败：" + (data.errors || []).join("；"));
        }
      } catch (e) { alert("保存失败：" + e.message); }
    }

    tagsDiv.appendChild(editBtn);
    tagsDiv.appendChild(input);
    }
    b.appendChild(tagsDiv);
  }

  const copyBtn = b.querySelector(".copy-btn");
  if (copyBtn) {
    copyBtn.addEventListener("click", () => {
      let parts = [];
      const mName = curMember || "成员";
      const timeStr = fmtCopyTime(msg.published_at);
      parts.push(mName + " " + timeStr);

      if (msg.text && msg.text.trim()) {
        parts.push(msg.text.trim());
      }

      if (msg.translation && msg.translation.trim()) {
        parts.push("----------------------------------------");
        parts.push(msg.translation.trim());
      }

      const textToCopy = parts.join("\n\n");
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast("📋 已复制整条消息与译文");
      }).catch(err => {
        showToast("⚠️ 复制失败：" + err.message);
      });
    });
  }


  const img = b.querySelector("img[data-lb]");
  if (img) img.addEventListener("click", () => openLightbox(parseInt(img.dataset.lb, 10), img));
  const jump = b.querySelector("a.jump");
  if (jump) jump.addEventListener("click", (e) => {
    e.preventDefault();
    searchQuery = "";
    syncSearchInput();
    jumpToDay(jump.dataset.date);
  });
  tl.appendChild(b);
}

let toastTimer = null;
function showToast(text) {
  let el = $("toastMsg");
  if (!el) {
    el = document.createElement("div");
    el.id = "toastMsg";
    el.className = "toast-msg";
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 2400);
}


// ── 灯箱 ─────────────────────────────────────────
let lbIndex = 0;
function openLightbox(i, opener) {
  if (i < 0 || i >= images.length) return;
  if (opener) lightboxOpener = opener;
  lbIndex = i;
  $("lbImg").src = images[i].url;
  $("lbImg").alt = images[i].caption || "归档图片";
  $("lbCounter").textContent = (i + 1) + " / " + images.length;
  $("lightbox").classList.add("open");
  $("lightbox").setAttribute("aria-hidden", "false");
  $("lbClose").focus();
}
function closeLightbox() {
  const box = $("lightbox");
  if (!box.classList.contains("open")) return;
  box.classList.remove("open");
  box.setAttribute("aria-hidden", "true");
  if (lightboxOpener && document.contains(lightboxOpener)) lightboxOpener.focus();
  lightboxOpener = null;
}
function lbMove(delta) {
  const next = lbIndex + delta;
  if (next < 0 || next >= images.length) return;
  openLightbox(next);
}
$("lightbox").addEventListener("click", (e) => {
  if (e.target === $("lightbox") || e.target === $("lbImg")) closeLightbox();
});
$("lbClose").addEventListener("click", closeLightbox);
$("lbPrev").addEventListener("click", (e) => { e.stopPropagation(); lbMove(-1); });
$("lbNext").addEventListener("click", (e) => { e.stopPropagation(); lbMove(1); });
document.addEventListener("keydown", (e) => {
  // 1. 灯箱模式优先处理
  if ($("lightbox").classList.contains("open")) {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") lbMove(-1);
    if (e.key === "ArrowRight") lbMove(1);
    if (e.key === "Tab") {
      const focusable = [$("lbClose"), $("lbPrev"), $("lbNext")];
      const index = focusable.indexOf(document.activeElement);
      e.preventDefault();
      focusable[(index + (e.shiftKey ? focusable.length - 1 : 1)) % focusable.length].focus();
    }
    return;
  }

  // 2. 如果焦点在输入框/文本域，不触发全局热键（Esc 除外）
  const isInput = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  if (isInput) {
    if (e.key === "Escape") {
      document.activeElement.blur();
    }
    return;
  }

  // 3. 全局键盘热键
  if (e.key === "[") {
    e.preventDefault();
    $("prevMonth").click();
    showToast("📅 切换至上一月");
  } else if (e.key === "]") {
    e.preventDefault();
    $("nextMonth").click();
    showToast("📅 切换至下一月");
  } else if (e.key === "/") {
    e.preventDefault();
    $("searchBox").focus();
    $("searchBox").select();
    showToast("🔍 聚焦搜索框 (按 Esc 退出)");
  }
});


// ── 控件 ─────────────────────────────────────────
function initTypeChips() {
  const box = $("typeChips");
  for (const [val, label] of TYPES) {
    const b = document.createElement("button");
    b.className = "chip" + (val === curType ? " active" : "");
    b.textContent = label;
    b.addEventListener("click", () => {
      curType = val;
      box.querySelectorAll(".chip").forEach((c, i) => c.classList.toggle("active", TYPES[i][0] === val));
      loadCalendar();                                     // 日历计数跟随类型筛选
      if (searchQuery) startSearch(searchQuery);          // 搜索模式下重搜（带新类型）
      else if (curYM) selectMonth(curYM.year, curYM.month);
    });
    box.appendChild(b);
  }
}
$("monthSelect").addEventListener("change", () => {
  const [y, m] = $("monthSelect").value.split("-").map(Number);
  selectMonth(y, m);
});
$("prevMonth").addEventListener("click", () => {
  const idx = months.findIndex((m) => m.year === curYM.year && m.month === curYM.month);
  if (idx < months.length - 1) selectMonth(months[idx + 1].year, months[idx + 1].month);
});
$("nextMonth").addEventListener("click", () => {
  const idx = months.findIndex((m) => m.year === curYM.year && m.month === curYM.month);
  if (idx > 0) selectMonth(months[idx - 1].year, months[idx - 1].month);
});
$("loadMore").addEventListener("click", () => {
  if (pageLoading || page >= totalPages) return;
  page++;
  loadPage();
});
$("calendarToggle").addEventListener("click", () => {
  const side = $("archiveSide");
  const expanded = side.classList.toggle("expanded");
  $("calendarToggle").setAttribute("aria-expanded", String(expanded));
  $("calendarToggle").textContent = expanded ? "▾ 收起日期跳转" : "▦ 按日期跳转";
});

// ── 回到顶部 ─────────────────────────────────────
const backTop = $("backTop");
window.addEventListener("scroll", () => {
  backTop.classList.toggle("show", window.scrollY > 400);
}, { passive: true });
backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
initInfiniteScroll();


// ── 登录状态 ─────────────────────────────────────
(async function initAuth() {
  try {
    const me = await (await fetch("/api/auth/me", { cache: "no-store" })).json();
    if (!me.auth_enabled) { window._isArchiveAdmin = true; $("adminLink").hidden = false; return; }  // 未启用账号系统：照旧
    if (me.user) {
      $("whoami").textContent = "👤 " + me.user.username + "（" + me.user.role + "）";
      $("logoutLink").hidden = false;
      if (me.user.role === "admin") { window._isArchiveAdmin = true; $("adminLink").hidden = false; }
    } else if (me.archive_public) {
      $("whoami").innerHTML = '<a href="/login">登录</a>';
    }
  } catch (e) { /* 忽略 */ }
})();
$("logoutLink").addEventListener("click", async (e) => {
  e.preventDefault();
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (err) { /* 忽略 */ }
  try { localStorage.removeItem("webAdminToken"); } catch (err) { /* 主题偏好保留 */ }
  location.href = "/login";
});

// ── 首页 ─────────────────────────────────────────
function fmtDate(utc) {
  if (!utc) return "";
  const d = new Date(utc + "Z");
  if (isNaN(d.getTime())) return utc.slice(0, 10);
  return (d.getMonth()+1) + "/" + d.getDate() + " " +
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function fmtDateShort(utc) {
  if (!utc) return "";
  const d = new Date(utc + "Z");
  if (isNaN(d.getTime())) return utc.slice(0, 10);
  return (d.getMonth()+1) + "/" + d.getDate();
}

async function showHome() {
  document.querySelector('.layout').style.display = 'none';
  $('backTop').style.display = 'none';
  $('archiveHome').classList.add('active');
  try {
    const data = await api("/api/archive/home");
    if (data.count === 1) {
      renderHome(data.members[0]);
    } else {
      renderMultiMemberHome(data.members);
    }
  } catch (e) {
    $("archiveHome").innerHTML = '<div style="text-align:center;color:var(--err);padding:60px 20px">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderHome(m) {
  const s = m.stats;
  // 成员信息
  $("homeMember").innerHTML =
    '<div class="hm-name">' + esc(m.display) + '</div>' +
    '<div class="hm-stats">📨 ' + s.total.toLocaleString() + ' 条消息 · ' + s.months + ' 个月 · ' + (s.first_date||'') + ' → ' + (s.last_date||'') + '</div>';

  // 图片横向卡片条
  const strip = $("photoStrip");
  if (m.pics.length) {
    strip.innerHTML = m.pics.map(p =>
      '<div class="photo-card" data-url="' + mediaUrl(p.url) + '" data-text="' + esc(p.text||'') + '">' +
        '<img src="' + mediaUrl(p.url) + '" alt="" loading="lazy">' +
        (p.text ? '<div class="pc-cap">' + esc(p.text) + '</div>' : '') +
      '</div>'
    ).join('');
    strip.querySelectorAll('.photo-card').forEach(el => {
      el.addEventListener('click', () => {
        $("lbImg").src = el.dataset.url;
        $("lbCounter").textContent = el.dataset.text || "";
        $("lightbox").classList.add("open");
        $("lightbox").setAttribute("aria-hidden", "false");
        $("lbClose").focus();
        $("lbPrev").style.display = "none";
        $("lbNext").style.display = "none";
      });
    });
  } else {
    strip.innerHTML = '<div style="color:var(--muted);padding:30px 10px">暂无图片</div>';
  }

  // 最新消息
  const msgDiv = $("homeMsgList");
  if (m.latest_msgs.length) {
    msgDiv.innerHTML = m.latest_msgs.map(msg =>
      '<div class="msg-preview">' +
        '<div class="mp-time">' + fmtDate(msg.published_at) + '</div>' +
        '<div class="mp-text">' + esc(msg.text) + '</div>' +
        (msg.translation ? '<div class="mp-trans">' + esc(msg.translation) + '</div>' : '') +
      '</div>'
    ).join('');
  } else {
    msgDiv.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px">暂无文字消息</div>';
  }

  // 快捷入口
  const latestYM = m.monthly && m.monthly.length ? { y: m.monthly[0].year, m: m.monthly[0].month } : null;
  $("homeActions").innerHTML =
    '<button class="ha-btn" id="haPics">📸 最新图片</button>' +
    '<button class="ha-btn primary" id="haFull">📂 进入完整归档</button>';
  if (latestYM) {
    $("haPics").onclick = () => { hideHome(); curMember = m.name; curType = "picture"; loadMembers(); };
  }
  $("haFull").onclick = () => { hideHome(); curMember = m.name; loadMembers(); };
}

function renderMultiMemberHome(members) {
  // 多成员：每个成员一个区块，布局与单成员一致
  let html = '';
  for (const m of members) {
    const s = m.stats;
    html += '<div class="home-member">' +
      '<div class="hm-name">' + esc(m.display) + '</div>' +
      '<div class="hm-stats">📨 ' + s.total.toLocaleString() + ' 条消息 · ' + s.months + ' 个月 · ' + (s.first_date||'') + ' → ' + (s.last_date||'') + '</div>' +
      '</div>';
    html += '<h2 class="home-label">最新写真</h2>';
    if (m.pics.length) {
      html += '<div class="photo-strip">' + m.pics.map(p =>
        '<div class="photo-card" data-url="' + mediaUrl(p.url) + '" data-text="' + esc(p.text||'') + '">' +
          '<img src="' + mediaUrl(p.url) + '" alt="" loading="lazy">' +
          (p.text ? '<div class="pc-cap">' + esc(p.text) + '</div>' : '') +
        '</div>'
      ).join('') + '</div>';
    } else {
      html += '<div style="color:var(--muted);padding:20px 10px">暂无图片</div>';
    }
    html += '<h2 class="home-label">最近消息</h2>';
    if (m.latest_msgs.length) {
      html += '<div class="msg-list">' + m.latest_msgs.map(msg =>
        '<div class="msg-preview">' +
          '<div class="mp-time">' + fmtDate(msg.published_at) + '</div>' +
          '<div class="mp-text">' + esc(msg.text) + '</div>' +
          (msg.translation ? '<div class="mp-trans">' + esc(msg.translation) + '</div>' : '') +
        '</div>'
      ).join('') + '</div>';
    } else {
      html += '<div style="text-align:center;color:var(--muted);padding:16px">暂无文字消息</div>';
    }
    html += '<div style="text-align:center;margin:16px 0 36px">' +
      '<button class="ha-btn primary" data-member="' + esc(m.name) + '">📂 进入 ' + esc(m.display) + ' 的归档</button>' +
      '</div>';
  }
  $("archiveHome").innerHTML = html;
  // 绑定事件
  $("archiveHome").querySelectorAll('.photo-card').forEach(el => {
    el.addEventListener('click', () => {
      $("lbImg").src = el.dataset.url;
      $("lbCounter").textContent = el.dataset.text || "";
      $("lightbox").classList.add("open");
      $("lightbox").setAttribute("aria-hidden", "false");
      $("lbClose").focus();
      $("lbPrev").style.display = "none";
      $("lbNext").style.display = "none";
    });
  });
  $("archiveHome").querySelectorAll('.ha-btn.primary').forEach(btn => {
    btn.addEventListener('click', () => { hideHome(); curMember = btn.dataset.member; loadMembers(); });
  });
}

function goHome() {
  curMember = "";
  curType = "";
  searchQuery = "";
  syncSearchInput();
  location.hash = "";
  showHome();
}

function hideHome() {
  $('archiveHome').classList.remove('active');
  document.querySelector('.layout').style.display = '';
}

// ── 入口（支持 #member=&y=&m=&t= 深链）────────────
function boot() {
  const p = new URLSearchParams(location.hash.slice(1));
  curMember = p.get("member") || "";
  curType = p.get("t") || "";
  searchQuery = normalizedQuery(p.get("q"));
  syncSearchInput();
  initTypeChips();
  if (!curMember) {
    showHome();
  } else {
    hideHome();
    loadMembers();
  }
}
boot();
// 从浏览器 bfcache 恢复时重新加载内容
window.addEventListener("pageshow", (e) => { if (e.persisted) boot(); });

// hash 变化：无 member 回到首页
window.addEventListener("hashchange", () => {
  const p = new URLSearchParams(location.hash.slice(1));
  const newMember = p.get("member") || "";
  if (!newMember && curMember) {
    // 从浏览页回到首页
    curMember = "";
    showHome();
  }
});
</script>
