<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📚</text></svg>">
<title>坂道监控 · 消息归档</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/archive.css">

</head>
<body>
<header>
  <h1>📚 消息归档</h1>
  <div class="chips" id="memberChips"></div>
  <span id="whoami" style="font-size:12.5px; color:var(--muted)"></span>
  <a href="#" id="homeNavLink" onclick="goHome();return false" style="margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px" title="回到首页">🏠 首页</a>
  <button class="theme-toggle" type="button" title="切换主题">🖥️</button>
  <a href="/" id="adminLink" hidden>⚙️ 管理端</a>
  <a href="#" id="logoutLink" hidden style="margin-left:0">登出</a>
</header>

<div id="homeSearchBar" class="home-search-bar">
  <input type="search" id="homeSearchInput" maxlength="100" placeholder="🔍 搜索所有归档消息…" aria-label="搜索归档">
  <button class="nav" id="homeSearchSubmit">搜索</button>
</div>

<div id="archiveHome" class="home">
  <!-- 骨架屏 -->
  <div class="home-skeleton" id="homeSkeleton">
    <div class="sk-hero"></div>
    <div class="sk-strip"><div></div><div></div><div></div><div></div></div>
    <div class="sk-msg"><div></div><div></div><div></div></div>
  </div>
  <div class="home-hero">
    <div class="hero-card" id="homeMember"></div>
    <div class="home-sec">&#x1F4F8; 最新写真</div>
    <div class="photo-strip" id="photoStrip"></div>
    <div class="home-sec">&#x1F4AC; 最近动态</div>
    <div class="msg-list" id="homeMsgList"></div>
    <div class="home-actions" id="homeActions"></div>
  </div>
</div>

<div class="layout">
<aside class="side" id="archiveSide">
  <button class="nav calendar-toggle" id="calendarToggle" type="button" aria-expanded="false">▦ 按日期跳转</button>
  <div class="cal">
    <div class="cal-head">
      <button id="calPrev">◀</button>
      <span class="title" id="calTitle">—</span>
      <button id="calNext">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot" id="calFoot"></div>
  </div>
</aside>
<main>
  <div class="toolbar">
    <button class="nav" id="prevMonth">← 上月</button>
    <select id="monthSelect"></select>
    <button class="nav" id="nextMonth">下月 →</button>
    <div class="chips" id="typeChips"></div>
    <span class="stats" id="stats"></span>
  </div>
  <div class="toolbar">
    <input type="search" id="searchBox" maxlength="100" placeholder="🔍 搜索原文 / 译文（空格分词）">
    <button class="nav" id="searchSubmit" type="button">搜索</button>
    <button class="nav" id="searchClear" hidden>✕ 清除搜索</button>
    <label class="toggle-row"><input type="checkbox" id="tagToggle" checked> 显示标签</label>
  </div>
  <div id="timeline"></div>
  <button class="nav" id="loadMore" hidden>加载更多 ↓</button>
  <div class="center" id="emptyHint" hidden></div>
</main>
</div>

<button id="backTop" title="回到顶部">⬆</button>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" aria-hidden="true">
  <span id="lbCounter"></span>
  <button id="lbClose" type="button" aria-label="关闭图片预览">关闭</button>
  <button class="nav-btn" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="nav-btn" id="lbNext">›</button>
</div>

<script src="/static/archive.js"></script>
</body>
</html>
