<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📚</text></svg>">
<title>坂道监控 · 消息归档</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/archive.css?v=3.1">

</head>
<body>
<header class="app-header">
  <!-- 1. 左侧 Brand 品牌区 -->
  <div class="header-brand">
    <a href="/archive" class="brand-logo" onclick="goHome();return false" title="坂道监控归档系统">
      <span class="brand-icon">🌸</span>
      <span class="brand-title">坂道归档</span>
    </a>
  </div>

  <!-- 2. 中间 Navigation 导航区 -->
  <nav class="header-nav">
    <div class="nav-tabs">
      <button class="nav-tab active" id="tabHome"><span class="tab-icon">🏠</span> 首页</button>
      <button class="nav-tab" id="tabMsg"><span class="tab-icon">💬</span> 消息</button>
      <button class="nav-tab" id="tabBlog"><span class="tab-icon">📄</span> 博客</button>
    </div>

    <!-- 成员归档工具下拉菜单 -->
    <div class="header-dropdown" id="archiveToolsDropdown" hidden>
      <button class="btn dropdown-toggle" id="btnArchiveMenu" type="button">
        <span>👥 成员工具</span>
        <span class="arrow">▾</span>
      </button>
      <div class="dropdown-menu">
        <button class="dropdown-item" id="btnArchiveMember" onclick="promptArchiveMember()">
          <span class="icon">📄</span> 抓取成员全量博客
        </button>
        <button class="dropdown-item" id="btnArchiveMessage" onclick="promptArchiveMessage()">
          <span class="icon">💬</span> 回填成员历史消息
        </button>
      </div>
    </div>
  </nav>

  <!-- 3. 右侧 Actions 系统与用户控制区 -->
  <div class="header-actions">
    <button class="theme-toggle" type="button" title="切换主题">🖥️</button>
    <span id="whoami" class="user-badge"></span>
    <a href="/" id="adminLink" hidden class="app-switch-btn" title="进入系统管理后台"><span>⚙️</span><span>管理后台</span></a>
    <button id="logoutBtn" hidden class="btn subdued-btn" style="white-space:nowrap;">🚪 登出</button>
  </div>
</header>

<div id="archiveHome" class="home active">
  <!-- 骨架屏 -->
  <div class="home-skeleton" id="homeSkeleton">
    <div class="sk-hero"></div>
    <div class="sk-strip"><div></div><div></div><div></div><div></div></div>
    <div class="sk-msg"><div></div><div></div><div></div></div>
  </div>
  <div class="portal-content" id="portalContent" style="display:none;">
    <!-- 1. 全站总览 Hero 看板 -->
    <div class="portal-hero" id="portalHero"></div>

    <!-- 2. 全站精选写真画廊 -->
    <div class="portal-sec">
      <div class="portal-sec-title">
        <span>📸 综合写真画廊</span>
        <span class="portal-sec-sub">精选 Message 写真与官方博客插图</span>
      </div>
    </div>
    <div class="photo-strip portal-strip" id="photoStrip"></div>

    <!-- 3. 核心归档专区入口 -->
    <div class="portal-sec">
      <div class="portal-sec-title">
        <span>🏛️ 归档板块专区</span>
        <span class="portal-sec-sub">三坂专属官方频道与监控成员快捷直达</span>
      </div>
    </div>
    <div class="portal-sections-grid" id="portalSections"></div>

    <!-- 4. 最新动态聚合流 -->
    <div class="portal-sec">
      <div class="portal-sec-title">
        <span>⚡ 最新鲜动态</span>
        <span class="portal-sec-sub">全站实时抓取与归档内容流</span>
      </div>
    </div>
    <div class="portal-feed-grid" id="homeFeedList"></div>

    <!-- 5. 时光隧道 -->
    <div class="portal-sec">
      <div class="portal-sec-title">
        <span>⏳ 往昔时光 · 历史回顾</span>
        <span class="portal-sec-sub">随机回溯过往精彩瞬间</span>
      </div>
    </div>
    <div class="portal-tunnel-grid" id="homeTimeTunnel"></div>
  </div>
</div>

<div class="layout">
<aside class="side" id="archiveSide">
  <button class="nav calendar-toggle" id="calendarToggle" type="button" aria-expanded="false">▦ 按日期跳转</button>
  <div class="cal">
    <div class="cal-head">
      <button id="calPrev">◀</button>
      <span class="title" id="calTitle">—</span>
      <button id="calNext">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot" id="calFoot"></div>
  </div>
</aside>
<main>
  <div class="toolbar msg-toolbar">
    <!-- 成员快捷下拉选择器 (PopOver) -->
    <div class="member-dropdown-wrap" id="memberDropdownWrap">
      <button class="btn member-select-btn" id="btnMemberDropdown" type="button" title="点击展开全员列表与快速搜索">
        <span class="m-icon">👥</span>
        <span class="m-cur-name" id="curMemberDisplay">选择成员</span>
        <span class="m-cur-count" id="curMemberCount"></span>
        <span class="arrow">▾</span>
      </button>

      <!-- 成员选择弹出卡片 (PopOver) -->
      <div class="member-popover" id="memberPopover" style="display:none;">
        <div class="member-popover-header">
          <div class="member-popover-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="memberSearchInput" placeholder="输入姓名快速查找..." autocomplete="off" />
            <button class="clear-btn" id="btnMemberSearchClear" type="button" style="display:none;">✕</button>
          </div>
          <span class="member-count-badge" id="memberTotalBadge">共 0 人</span>
        </div>
        <div class="member-popover-list" id="memberPopoverList"></div>
      </div>
    </div>

    <button class="nav" id="prevMonth">← 上月</button>
    <select id="monthSelect"></select>
    <button class="nav" id="nextMonth">下月 →</button>
    <div class="chips" id="typeChips"></div>
    <span class="stats" id="stats"></span>
  </div>
  <div class="toolbar">
    <input type="search" id="searchBox" maxlength="100" placeholder="🔍 搜索原文 / 译文（空格分词）">
    <button class="nav" id="searchSubmit" type="button">搜索</button>
    <button class="nav" id="searchClear" hidden>✕ 清除搜索</button>
    <label class="toggle-row"><input type="checkbox" id="tagToggle" checked> 显示标签</label>
  </div>
  <div id="timeline"></div>
  <div id="blogGrid" class="blog-grid" style="display:none;">
    <div class="toolbar blog-toolbar">
      <!-- 博客三坂分段控制器 -->
      <div class="segmented-control" id="blogGroupSegment">
        <button type="button" class="seg-btn active" data-key="nogizaka">💜 乃木坂46 <span class="seg-badge" id="bgNogiBadge"></span></button>
        <button type="button" class="seg-btn" data-key="sakurazaka">🌸 樱坂46 <span class="seg-badge" id="bgSakuraBadge"></span></button>
        <button type="button" class="seg-btn" data-key="hinatazaka">🩵 日向坂46 <span class="seg-badge" id="bgHinataBadge"></span></button>
      </div>

      <!-- 博客作者快捷下拉选择器 -->
      <div class="author-dropdown-wrap" id="blogAuthorDropdownWrap">
        <button class="btn author-select-btn" id="btnBlogAuthorDropdown" type="button" title="点击展开全部作者与快速搜索">
          <span class="a-icon">👥</span>
          <span class="a-cur-name" id="curBlogAuthorDisplay">全部作者</span>
          <span class="arrow">▾</span>
        </button>
        <!-- 作者选择弹出菜单 (带实时搜索) -->
        <div class="author-popover" id="blogAuthorPopover" style="display:none;">
          <div class="author-popover-header">
            <div class="author-popover-search">
              <span class="search-icon">🔍</span>
              <input type="text" id="blogAuthorSearchInput" placeholder="输入作者姓名快速查找..." autocomplete="off" />
              <button class="clear-btn" id="btnBlogAuthorSearchClear" type="button" style="display:none;">✕</button>
            </div>
            <span class="author-count-badge" id="blogAuthorTotalBadge">共 0 位</span>
          </div>
          <div class="author-popover-list" id="blogAuthorPopoverList"></div>
        </div>
      </div>

      <span class="stats" id="blogStats" style="margin-left:auto;"></span>
    </div>
    <div id="blogHero" class="blog-hero" style="display:none;"></div>
    <div id="blogCards" class="blog-cards"></div>
    <div id="blogPagination" class="blog-pagination" style="display:none;"></div>
  </div>
  <button class="nav" id="loadMore" hidden>加载更多 ↓</button>
  <div class="center" id="emptyHint" hidden></div>
</main>
</div>

<button id="backTop" title="回到顶部">⬆</button>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" aria-hidden="true">
  <span id="lbCounter"></span>
  <button id="lbClose" type="button" aria-label="关闭图片预览">关闭</button>
  <button class="nav-btn" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="nav-btn" id="lbNext">›</button>
</div>

<div id="blogReader" class="blog-reader" style="display:none;" role="dialog" aria-modal="true">
  <div class="br-header">
    <button id="brClose" class="nav-btn">← 返回</button>
    <div class="br-title" id="brTitle"></div>
    <div class="br-header-actions" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <div id="brModeSelector" class="br-mode-selector" style="display:none;">
        <button type="button" class="brm-btn" data-mode="ja-zh">日中对照</button>
        <button type="button" class="brm-btn" data-mode="ja-only">日文</button>
        <button type="button" class="brm-btn" data-mode="zh-only">中文</button>
      </div>
      <button id="brDeleteTranslate" class="nav-btn" style="display:none; white-space:nowrap; background:rgba(255,59,48,0.15); color:#ff453a; border-color:rgba(255,59,48,0.3);">🗑️ 删除翻译</button>
      <button id="brTranslate" class="nav-btn" style="white-space:nowrap;">🌐 翻译</button>
    </div>
  </div>
  <div class="br-content" id="brContent"></div>
</div>

<!-- Custom Confirm Modal -->
<div id="customConfirmModal" class="custom-modal-backdrop" style="display:none;">
  <div class="custom-modal-card">
    <div class="cm-icon danger">🗑️</div>
    <h3 class="cm-title" id="cmTitle">确认操作</h3>
    <p class="cm-message" id="cmMessage">确定要执行此操作吗？</p>
    <div class="cm-actions">
      <button id="cmCancel" class="cm-btn secondary">取消</button>
      <button id="cmConfirm" class="cm-btn danger">确认删除</button>
    </div>
  </div>
</div>

<!-- Custom Prompt Input Modal -->
<div id="customPromptModal" class="custom-modal-backdrop" style="display:none;">
  <div class="custom-modal-card">
    <div class="cm-icon" id="pmIcon">📥</div>
    <h3 class="cm-title" id="pmTitle">输入内容</h3>
    <p class="cm-message" id="pmMessage">请在下方输入相关信息：</p>
    <div class="cm-input-wrapper">
      <input type="text" id="pmInput" class="cm-input" placeholder="" autocomplete="off" />
      <label id="pmCheckLabel" class="cm-checkbox-group" style="display:none;">
        <input type="checkbox" id="pmCheckbox" />
        <span id="pmCheckText">开启 AI 翻译</span>
      </label>
    </div>
    <div class="cm-actions">
      <button id="pmCancel" class="cm-btn secondary">取消</button>
      <button id="pmConfirm" class="cm-btn primary">提交</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<script src="/static/archive.js?v=3.1"></script>
</body>
</html>
