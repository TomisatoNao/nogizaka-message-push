<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="archBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#86198f"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="glowPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle with Glass Border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#archBgGrad)"/>
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Floating Message Chat Bubble -->
  <rect x="25" y="26" width="24" height="16" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="31.5" cy="34" r="1.5" fill="#fff"/>
  <circle cx="37" cy="34" r="1.5" fill="#fff"/>
  <circle cx="42.5" cy="34" r="1.5" fill="#fff"/>

  <!-- Floating Sakura Petals -->
  <path d="M90 24 C96 20 102 24 100 30 C98 34 92 36 88 32 C86 28 88 26 90 24 Z" fill="url(#glowPetal)" filter="url(#archGlow)"/>
  <path d="M60 20 C64 16 70 18 68 24 C66 28 62 29 59 26 C58 23 59 21 60 20 Z" fill="#fbcfe8" opacity="0.85"/>

  <!-- Holographic Memory Book -->
  <path d="M64 98 C50 92 30 93 20 97 L20 54 C30 50 50 49 64 55 C78 49 98 50 108 54 L108 97 C98 93 78 92 64 98 Z" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  
  <!-- Left & Right Pages -->
  <path d="M64 94 C52 88 32 89 22 93 L22 52 C32 48 52 47 64 53 Z" fill="url(#bookGrad)"/>
  <path d="M64 94 C76 88 96 89 106 93 L106 52 C96 48 76 47 64 53 Z" fill="url(#bookGrad)"/>

  <!-- Page Content: Text Lines & Sakura Emblem -->
  <line x1="30" y1="62" x2="54" y2="62" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="71" x2="50" y2="71" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="80" x2="44" y2="80" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round"/>

  <circle cx="85" cy="70" r="10" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="2.5 2.5"/>
  <circle cx="85" cy="70" r="4.5" fill="#f43f5e" filter="url(#archGlow)"/>
  <path d="M85 57 L85 61 M85 79 L85 83 M72 70 L76 70 M94 70 L98 70" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Glowing Spine -->
  <line x1="64" y1="51" x2="64" y2="96" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round" filter="url(#archGlow)"/>
</svg>
