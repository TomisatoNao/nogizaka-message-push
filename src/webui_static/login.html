<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="icon" href="/static/admin_icon.svg" type="image/svg+xml">
<title>登录 · 坂道监控</title>
<link rel="stylesheet" href="/static/theme.css?v=20260830_5">
<script src="/static/theme.js?v=20260830_5"></script>
<style>
  :root {
    --accent2: var(--accent-2, #a78bfa);
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
    position: relative;
    overflow-x: hidden;
  }

  /* 顶部全局主题切换按钮 */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 50;
  }

  /* 背景环境光晕 */
  .ambient-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 580px;
    height: 580px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 20%, transparent) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: pulseGlow 6s ease-in-out infinite alternate;
  }
  @keyframes pulseGlow {
    0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.65; }
    100% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
  }

  /* 登录核心 Bento 卡片 */
  .card {
    position: relative;
    z-index: 1;
    width: min(420px, 100%);
    padding: 40px 38px 32px;
    border-radius: 28px;
    background: color-mix(in srgb, var(--card-solid, var(--card)) 86%, transparent);
    border: 1px solid var(--border);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.05);
    animation: cardRise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardRise {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 品牌头部区域 */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .brand .logo-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent2) 24%, transparent));
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 24%, transparent);
    flex: none;
  }
  .brand .logo {
    width: 30px;
    height: 30px;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-text h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 750;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .brand-text .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0;
    line-height: 1.4;
  }

  /* 输入框与浮动 Label */
  .field {
    position: relative;
    margin-bottom: 16px;
  }
  .field input {
    width: 100%;
    box-sizing: border-box;
    padding: 24px 14px 8px;
    border: 1.5px solid var(--border-soft, var(--border));
    border-radius: 14px;
    background: var(--field);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    transition: all 0.18s ease;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    background: color-mix(in srgb, var(--field) 80%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text);
    box-shadow: 0 0 0 60px var(--card) inset;
    transition: background-color 100000s ease-in-out 0s;
  }
  .field label {
    position: absolute;
    left: 14px;
    top: 16px;
    font-size: 13.5px;
    color: var(--muted);
    pointer-events: none;
    transition: all 0.16s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label,
  .field input:-webkit-autofill + label {
    top: 6px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--accent);
  }
  .field .toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: all 0.15s ease;
  }
  .field .toggle:hover {
    color: var(--text);
    background: color-mix(in srgb, var(--text) 8%, transparent);
  }
  .field .toggle svg {
    width: 17px;
    height: 17px;
  }

  /* 保持登录选项 */
  .remember-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 2px 18px;
    font-size: 12.5px;
    color: var(--muted);
    user-select: none;
  }
  .remember-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .remember-label:hover {
    color: var(--text);
  }
  .remember-label input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
    border-radius: 4px;
  }

  /* 登录主按钮 */
  button.submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.06em;
    transition: transform 0.08s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 36%, transparent);
  }
  button.submit:hover {
    box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 46%, transparent);
  }
  button.submit:active {
    transform: translateY(1px) scale(0.99);
  }
  button.submit:disabled {
    opacity: 0.65;
    cursor: default;
    box-shadow: none;
  }

  /* 提示与报错信息 */
  .msg {
    margin-top: 16px;
    font-size: 13px;
    min-height: 20px;
    line-height: 1.5;
    text-align: center;
  }
  .msg.err {
    color: var(--err);
    animation: shake 0.32s;
  }
  .msg.ok {
    color: var(--ok);
  }
  @keyframes shake {
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .notice {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft, var(--border));
    font-size: 12px;
    color: var(--muted);
    line-height: 1.85;
  }
  code {
    background: color-mix(in srgb, var(--muted) 16%, transparent);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 11.5px;
  }
  a {
    color: var(--accent);
  }

  /* 底部胶囊微标签 */
  .foot {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft, var(--border));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .foot-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    opacity: 0.85;
  }
  .foot-icon {
    width: 14px;
    height: 14px;
    opacity: 0.75;
  }
  .foot-dot {
    opacity: 0.35;
    font-size: 10px;
  }

  /* 手机端适配 */
  @media (max-width: 640px) {
    html, body { min-height: 100vh; min-height: 100dvh; }
    body { padding: 16px; align-items: center; justify-content: center; }
    .card { padding: 28px 22px 22px; border-radius: 22px; width: 100%; max-width: 360px; box-sizing: border-box; }
    .theme-toggle {
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 36px; height: 36px; font-size: 15px;
    }
    input[type=text], input[type=password] { font-size: 16px !important; }
    button.submit { padding: 13.5px; font-size: 15.5px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" type="button" title="切换主题">🖥️</button>
<div class="ambient-glow"></div>

<div class="card">
  <div class="brand">
    <div class="logo-wrapper">
      <img src="/static/admin_icon.svg" alt="Logo" class="logo">
    </div>
    <div class="brand-text">
      <h1>坂道监控</h1>
      <p class="sub" id="sub">请登录以继续访问</p>
    </div>
  </div>

  <form id="form" autocomplete="on">
    <div class="field">
      <input id="u" name="username" placeholder=" " autocomplete="username" autofocus required>
      <label for="u">用户名</label>
    </div>
    <div class="field">
      <input id="p" name="password" type="password" placeholder=" " autocomplete="current-password" required>
      <label for="p">密码</label>
      <button type="button" class="toggle" id="pwToggle" title="显示 / 隐藏密码">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
    <div class="remember-row">
      <label class="remember-label">
        <input type="checkbox" id="rememberMe" checked>
        <span>30 天内保持登录 (免密访问)</span>
      </label>
    </div>
    <button type="submit" class="submit" id="btn">登 录</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="notice" id="notice" hidden></div>

  <div class="foot" id="foot">
    <span class="foot-pill">
      <svg class="foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      消息归档
    </span>
    <span class="foot-dot">·</span>
    <span class="foot-pill">
      <svg class="foot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      配置管理
    </span>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function nextUrl() {
  const p = new URLSearchParams(location.search).get("next") || "/";
  return (p.startsWith("/") && !p.startsWith("//")) ? p : "/";   // 只接受站内路径，杜绝开放重定向
}

function getRedirectTarget(user) {
  const next = nextUrl();
  if (user && user.role === "admin") {
    return next;
  }
  if (next.startsWith("/archive")) {
    return next;
  }
  return "/archive";
}

function showNotice(html) {
  $("form").hidden = true;
  $("notice").hidden = false;
  $("notice").innerHTML = html;
}

(async function init() {
  try {
    const me = await (await fetch("/api/auth/me", { cache: "no-store" })).json();
    if (!me.auth_enabled) {
      $("sub").textContent = "账号系统未启用";
      showNotice("在 <code>config.json</code> 的 <code>auth.enabled</code> 打开后即可使用账号登录。" +
                 '<br><a href="/">前往管理端 →</a>');
      return;
    }
    if (!me.has_users) {
      $("sub").textContent = "还没有创建任何账号";
      showNotice("在服务器上执行以下命令创建第一个管理员：<br>" +
                 "<code>python tools/manage_users.py add 用户名</code><br>" +
                 "密码在命令行交互输入，不会留在历史记录里。");
      return;
    }
    if (me.user) {
      location.replace(getRedirectTarget(me.user));
      return;
    }
  } catch (e) { /* 离线时正常显示表单 */ }
})();

let pwVisible = false;
$("pwToggle").addEventListener("click", () => {
  const el = $("p");
  pwVisible = !pwVisible;
  el.type = pwVisible ? "text" : "password";
  $("eyeIcon").innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btn"), msg = $("msg");
  btn.disabled = true;
  btn.textContent = "登录中…";
  msg.className = "msg";
  msg.textContent = "";
  try {
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: $("u").value,
        password: $("p").value,
        remember: $("rememberMe") ? $("rememberMe").checked : true,
      }),
    });
    const data = await resp.json();
    if (data.ok) {
      msg.className = "msg ok";
      msg.textContent = "✅ 欢迎回来，" + data.user.username;
      location.href = getRedirectTarget(data.user);
      return;
    }
    msg.className = "msg err";
    msg.textContent = (data.errors || ["登录失败"]).join("；");
    $("p").value = "";
    $("p").focus();
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = "请求失败：" + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "登 录";
  }
});
</script>
</body>
</html>
