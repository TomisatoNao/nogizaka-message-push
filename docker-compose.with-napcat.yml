services:
  sakamichi-push:
    image: ghcr.io/tomisatonao/nogizaka-message-push:latest
    container_name: sakamichi-push
    restart: unless-stopped
    ports:
      # 管理端对外端口（局域网/公网）
      - "46046:46046"
      # NapCat 入站事件端口；默认只绑定 NAS 本机。Windows NapCat 跨主机
      # 上报时将 NAPCAT_EVENT_BIND 改为 NAS 局域网 IP（不要直接暴露公网）。
      - "${NAPCAT_EVENT_BIND:-127.0.0.1}:46047:46047"
    expose:
      # 同一 Compose 的 NapCat 可直接访问 sakamichi-push:46047，无需走宿主机端口。
      - "46047"
    environment:
      - TZ=Asia/Tokyo
      # 启用 NapCat OneBot11 推送通道
      - ENABLE_NAPCAT_QQ=true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - ACCOUNT=${NAPCAT_ACCOUNT:-}
      - HTTP_ENABLE=true
      - HTTP_PORT=36036
      - WEBUI_PORT=6099
      - WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN:-change_this_token}
      - NAPCAT_UID=0
      - NAPCAT_GID=0
    ports:
      - "6099:6099" # NapCat 网页扫码登录控制台 (http://NAS_IP:6099/webui?token=${NAPCAT_WEBUI_TOKEN:-change_this_token})
      - "36036:36036" # OneBot 11 HTTP 接口（使用高端口避免占用宿主机 3000）
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/data:/app/.napcat
