name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q src config tools tests main.py

      - name: Config load test
        run: python tests/test_config_load.py

      - name: Unit assertions
        run: python tests/test_units.py

      - name: Web admin test
        run: python tests/test_webui.py

      - name: Archive test
        run: python tests/test_archive.py

      - name: Auth test
        run: python tests/test_auth.py

      - name: Bot commands test
        run: python tests/test_qq_commands.py

      - name: Tagger test
        run: python tests/test_tagger.py

      - name: QQ official groups test
        run: python tests/test_qq_official_groups.py

      - name: Social media monitor test
        run: python tests/test_social.py
