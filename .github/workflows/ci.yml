name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ADMIN_VISUAL_MAX_RATIO: "0.60"
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q src config tools tests main.py

      - name: Config load test
        run: python tests/test_config_load.py

      - name: Unit assertions
        run: python tests/test_units.py

      - name: Web admin test
        run: python tests/test_webui.py

      - name: Archive test
        run: python tests/test_archive.py

      - name: Auth test
        run: python tests/test_auth.py

      - name: Bot commands test
        run: python tests/test_qq_commands.py

      - name: Tagger test
        run: python tests/test_tagger.py

      - name: QQ official groups test
        run: python tests/test_qq_official_groups.py

      - name: Social media monitor test
        run: python tests/test_social.py

      - name: Blog card test
        run: python tests/test_blog_card.py

      - name: Avatar manager test
        run: pytest -v -s --tb=short tests/test_avatar_manager.py

      - name: Member directory test
        run: pytest -v -s --tb=short tests/test_member_directory.py

      - name: Social single test
        run: pytest -v -s --tb=short tests/test_social_single.py

      - name: Letters test
        run: python tests/test_letters.py

      - name: Pytest full suite with coverage
        run: pytest --cov=src --cov-report=term

  build-and-push:
    name: Build and publish verified image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          image_name_lower="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${short_sha}"
          fi
          echo "image=ghcr.io/${image_name_lower}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push verified image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.release.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release reference
        shell: bash
        run: |
          {
            echo "### Verified container image"
            echo ""
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
